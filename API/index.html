<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>Pogoda</title>

    <script src="https://kit.fontawesome.com/6df5d86965.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1>Aplikacja pogodowa</h1>
    </header>
    <main>
        <div class="location">
            <p class="city_name"></p>
        </div>
        <div class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="podaj nazwę miasta">
        </div>
        <div class="weather">
            <p class="date"></p>
            <div class="temp_info">
                <p class="temp"></p>
                <div>
                    <p class="description"></p>
                    <p class="feels_like"></p>
                </div>
            </div>
        </div>
        <div class="weather_bottom">
            <div class="weather-info">
            <p>Prędkość wiatru</p>
            <p class="wind-speed"></p>
            </div>
            <div class="weather-info">
            <p>Ciśnienie</p>
            <p class="pressure"></p>
            </div>
            <div class="weather-info">
                <p>Wilgotność</p>
                <p class="humidity"></p>
                </div>
            <div class="weather-info">
                <p>Widoczność</p>
                <p class="visibility"></p>
                </div>
            <div class="weather-info">
                <p>Zachmurzenie</p>
                <p class="clouds"></p>
                </div>
            <div class="weather-info">
                <p>Opady</p>
                <p class="rain"></p>
            </div>
        </div>
    </main>
    <footer>
        <p>Projekt WSB Merito Gdańsk 2026</p>
        <p>Autor: Radek W.</p>
    </footer>
    <script src="./main.js"></script>
</body></html>
